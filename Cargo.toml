[package]
name = "ai-watermark-detector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Statistical text-watermark scorer (SynthID/KGW) + C2PA file-provenance checker, in one Rust CLI"

[lib]
name = "ai_watermark_detector"
path = "src/lib.rs"

[[bin]]
name = "ai-watermark-detector"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
quick-xml = { version = "0.41.0", features = ["serialize"] }
yaml_serde = "0.10.6"
